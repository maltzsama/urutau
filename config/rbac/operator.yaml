# Permissions for the urutau-operator service account (urutau-system).
#
# The coordinator gets its OWN identity dynamically: for every pipeline the
# reconciler creates a ServiceAccount, a Role (cdcpipelines + status in the
# pipeline's namespace) and a RoleBinding — see internal/operator/controller.go.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: urutau-operator-role
rules:
  - apiGroups: ["urutau.io"]
    resources: ["cdcpipelines"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["urutau.io"]
    resources: ["cdcpipelines/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["urutau.io"]
    resources: ["cdcpipelines/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The operator references credentials in pod specs; it never mutates them.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # The per-pipeline coordinator Role grants these to the coordinator's own
  # ServiceAccount. RBAC forbids granting what you do not hold, so the
  # operator must hold them too — it never uses deployments/pods itself (the
  # coordinator creates the worker Deployments and reads worker Pods).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  # ConfigMap carries the resolved spec; the Service is the coordinator's
  # headless stable identity. Delete flows through owner-reference GC.
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Per-pipeline coordinator identity, created dynamically at reconcile.
  # list/watch are required because the manager caches every type it
  # creates/owns, not just the ones it watches by name.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: urutau-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: urutau-operator-role
subjects:
  - kind: ServiceAccount
    name: urutau-operator
    namespace: urutau-system
