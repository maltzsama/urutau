apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: urutau-operator-role
rules:
  - apiGroups: ["urutau.io"]
    resources: ["cdcpipelines"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["urutau.io"]
    resources: ["cdcpipelines/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["urutau.io"]
    resources: ["cdcpipelines/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: urutau-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: urutau-operator-role
subjects:
  - kind: ServiceAccount
    name: urutau-operator
    namespace: urutau-system