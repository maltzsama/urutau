apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cdcpipelines.urutau.io
spec:
  group: urutau.io
  names:
    kind: CDCPipeline
    listKind: CDCPipelineList
    plural: cdcpipelines
    singular: cdcpipeline
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                definition:
                  type: object
                  properties:
                    image: {type: string}
                    entrypoint: {type: string}
                    s3: {type: string}
                    inline:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                secrets:
                  type: object
                  properties:
                    source: {type: string}
                    catalog: {type: string}
                coordinator:
                  type: object
                  properties:
                    snapshot:
                      type: object
                      properties:
                        chunkSize: {type: integer}
                        maxParallelChunks: {type: integer}
                    supervision:
                      type: object
                      properties:
                        ackTimeout: {type: string}
                        maxResets: {type: integer}
                        window: {type: string}
                    statusInterval: {type: string}
                    metricsAddr: {type: string}
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                workerDefaults:
                  type: object
                  properties:
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase: {type: string}
                observedGeneration: {type: integer}
                runId: {type: string}
                specHash: {type: string}
                terminated:
                  type: object
                  properties:
                    reason: {type: string}
                    at: {type: string}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp