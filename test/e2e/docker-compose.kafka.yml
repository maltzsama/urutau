services:
  # Redpanda bundles a Kafka-API broker and a Confluent-compatible schema
  # registry in one container — this is a dedicated overlay (issue #17,
  # decision 2), composed alongside the main stack (docker-compose.yml)
  # only when a test exercises the Kafka+Avro source. `docker compose -f
  # docker-compose.yml -f docker-compose.kafka.yml up -d --wait` starts
  # both; nothing in the main stack depends on this file, so every other
  # e2e suite is unaffected.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    ports:
      - "19092:19092"
      - "18081:8081"
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://127.0.0.1:19092
      - --schema-registry-addr=0.0.0.0:8081
      - --check=false
      - --set
      - redpanda.auto_create_topics_enabled=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
