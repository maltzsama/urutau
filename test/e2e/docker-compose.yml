services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    command:
      - --server-id=1
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=600
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shop
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro

  # Logical-decoding source for the Postgres pipeline (wal_level=logical is
  # the only knob pgoutput needs; slot and publication are created by the
  # runner itself).
  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    # wal_sender_timeout=5s tightens the keepalive cadence (default 60s
    # sends one every ~30s) so the idle-source caught-up proof closes fast.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=5", "-c", "max_wal_senders=5", "-c", "wal_sender_timeout=5s"]
    environment:
      POSTGRES_USER: repl
      POSTGRES_PASSWORD: replpass
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repl -d shop"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: urutau
      RUSTFS_SECRET_KEY: urutau_dev_secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1

  # RustFS does not create buckets itself, and Polaris fails to register
  # the catalog while the path is missing — same bootstrap as the homelab.
  bucket-init:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: urutau
      AWS_SECRET_ACCESS_KEY: urutau_dev_secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
          echo waiting for rustfs...; sleep 2
        done
        aws --endpoint-url http://rustfs:9000 s3 mb s3://warehouse || true
        echo bucket ready

  polaris:
    image: apache/polaris:latest
    ports:
      - "8181:8181"
      - "8182:8182"
    depends_on:
      bucket-init:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: urutau
      AWS_SECRET_ACCESS_KEY: urutau_dev_secret
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 10s

  polaris-setup:
    image: alpine/curl:8.11.1
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      CLIENT_ID: root
      CLIENT_SECRET: s3cr3t
      CATALOG_NAME: quickstart_catalog
      REALM: POLARIS
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        TOKEN=$$(curl -sf -X POST http://polaris:8181/api/catalog/v1/oauth/tokens \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          -d "grant_type=client_credentials&client_id=$${CLIENT_ID}&client_secret=$${CLIENT_SECRET}&scope=PRINCIPAL_ROLE:ALL" \
          | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        test -n "$$TOKEN"
        if [ "$$(curl -s -o /dev/null -w '%{http_code}' http://polaris:8181/api/management/v1/catalogs/$$CATALOG_NAME -H "Authorization: Bearer $$TOKEN" -H "Polaris-Realm: $$REALM")" != "200" ]; then
          curl -sf -X POST http://polaris:8181/api/management/v1/catalogs \
            -H "Authorization: Bearer $$TOKEN" -H "Polaris-Realm: $$REALM" \
            -H 'Content-Type: application/json' \
            -d '{"catalog":{"name":"'$$CATALOG_NAME'","type":"INTERNAL","readOnly":false,"properties":{"default-base-location":"s3://warehouse"},"storageConfigInfo":{"storageType":"S3","allowedLocations":["s3://warehouse"],"endpoint":"http://localhost:9000","endpointInternal":"http://rustfs:9000","pathStyleAccess":true,"region":"us-east-1"}}}' \
            >/dev/null
        fi
        curl -sf -X PUT "http://polaris:8181/api/management/v1/catalogs/$$CATALOG_NAME/catalog-roles/catalog_admin/grants" \
          -H "Authorization: Bearer $$TOKEN" -H "Polaris-Realm: $$REALM" \
          -H 'Content-Type: application/json' \
          -d '{"type": "catalog", "privilege": "CATALOG_MANAGE_CONTENT"}' \
          >/dev/null || true
        echo catalog created

  trino:
    image: trinodb/trino:470
    ports:
      - "8080:8080"
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s