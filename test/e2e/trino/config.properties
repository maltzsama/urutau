# The in-cluster Trino's config (k8s/trino.yaml): the image's single-node
# defaults plus a larger per-query memory. The production-readiness settle
# reads a whole 1M-row table with its payloads and merge-on-read deletes in
# one query; at the default (30% of the heap, 1.44 GB) the full-profile
# matrix failed on every poll with INSUFFICIENT_RESOURCES.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
query.max-memory=3GB
query.max-memory-per-node=3GB
