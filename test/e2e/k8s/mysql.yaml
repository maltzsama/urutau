# MySQL 8.4 with the binlog settings the CDC source needs — the in-cluster
# twin of the compose `mysql` service. The init SQL (shop.orders,
# shop.order_items, the repl user) comes from ../mysql/init/init.sql via
# configMapGenerator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --server-id=1
            - --log-bin=binlog
            - --binlog-format=ROW
            - --binlog-row-image=FULL
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
            # Three hours: the full production-readiness profile runs a 30m
            # live window and up to 60m of settle, and a pipeline that falls
            # behind must still find its binlog to resume from.
            - --binlog-expire-logs-seconds=10800
            # The full profile seeds 1M rows per table and sustains ~1k
            # mutations/s per table; the default 128M pool thrashes.
            - --innodb-buffer-pool-size=4G
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpass
            - name: MYSQL_DATABASE
              value: shop
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # Sized for the full profile (3 tables x 1M rows, ~3k mutations/s):
          # at 1 CPU / 1Gi the source itself capped the load generator.
          resources:
            requests:
              cpu: "2"
              memory: 5Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: init
          configMap:
            name: mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
