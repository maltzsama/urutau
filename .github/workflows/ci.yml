name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # New push to the same PR cancels the in-progress run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache golangci-lint
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/golangci-lint
            ./bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-v1-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-v1-

      - name: Cache buf
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/buf
            ./bin/buf
          key: ${{ runner.os }}-buf-v1-${{ hashFiles('Makefile', 'buf.yaml', 'buf.gen.yaml') }}
          restore-keys: |
            ${{ runner.os }}-buf-v1-

      - name: Bootstrap tools (lint + proto)
        run: make bootstrap

      - name: Regenerate proto (check freshness)
        run: |
          make proto
          git diff --exit-code -- internal/transport/pb

      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Lint
        run: make lint

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint the chart
        run: helm lint charts/urutau-operator

      # Render the defaults, a different release namespace (the webhook
      # namespace must follow it), the webhook-off path, and the cert-manager
      # off paths — asserting the failure and the caBundle render, so the
      # chart cannot silently ship a webhook with no trust anchor (#339), a
      # disabled webhook's stray port (#341), or broken optional extras.
      - name: Template the chart
        run: |
          set -euo pipefail
          C=charts/urutau-operator

          helm template urutau $C --namespace urutau-system > /dev/null
          helm template urutau $C --namespace team-a > /dev/null
          helm template urutau $C --namespace urutau-system \
            --set webhook.enabled=false --set operator.replicaCount=1 > /dev/null

          # webhook.enabled=false must not declare the 9443 webhook port.
          if helm template urutau $C -n urutau-system --set webhook.enabled=false | grep -q 9443; then
            echo "webhook disabled but the 9443 port still renders"; exit 1
          fi

          # cert-manager off with no caBundle is unsatisfiable: the render must
          # fail rather than ship failurePolicy: Fail with no trust anchor.
          if helm template urutau $C -n urutau-system --set webhook.certManager.enabled=false > /dev/null 2>&1; then
            echo "cert-manager off with no caBundle rendered instead of failing"; exit 1
          fi

          # cert-manager off with a caBundle renders it.
          helm template urutau $C -n urutau-system \
            --set webhook.certManager.enabled=false --set webhook.caBundle=Zm9v \
            | grep -q 'caBundle: Zm9v'

          # The optional PDB and ServiceMonitor render when enabled.
          helm template urutau $C -n urutau-system \
            --set podDisruptionBudget.enabled=true --set serviceMonitor.enabled=true > /dev/null

          # fullnameOverride renames the cluster-scoped resources, so a second
          # release does not collide (#341).
          helm template urutau $C -n urutau-system --set fullnameOverride=myop \
            | grep -q 'name: myop-validating-webhook'

          # KEDA flags render only when configured (#359).
          if helm template urutau $C -n urutau-system | grep -q -- '--keda-prometheus-address='; then
            echo "keda address rendered with no value set"; exit 1
          fi
          helm template urutau $C -n urutau-system \
            --set operator.keda.prometheusAddress=http://p:9090 --set operator.keda.threshold=10 \
            | grep -q -- '--keda-threshold=10'

          # The operator can record Events (#364).
          helm template urutau $C -n urutau-system | grep -q 'resources: \["events"\]'

          # Namespace-scoped RBAC: no cluster-wide binding, one RoleBinding per
          # watched namespace (#361).
          helm template urutau $C -n urutau-system \
            --set rbac.clusterWide=false --set 'operator.watchNamespaces=team-a\,team-b' \
            > /tmp/urutau-ns-rbac.yaml
          if grep -q 'kind: ClusterRoleBinding' /tmp/urutau-ns-rbac.yaml; then
            echo "namespace-scoped mode still renders a ClusterRoleBinding"; exit 1
          fi
          [ "$(grep -c 'kind: RoleBinding' /tmp/urutau-ns-rbac.yaml)" = "2" ]
          # ...and it is unsatisfiable with no watched namespaces.
          if helm template urutau $C -n urutau-system --set rbac.clusterWide=false >/dev/null 2>&1; then
            echo "rbac.clusterWide=false with no watchNamespaces rendered instead of failing"; exit 1
          fi

          # A second release can share the CRD (#360).
          if helm template urutau $C -n urutau-system --set crds.install=false \
            | grep -q 'kind: CustomResourceDefinition'; then
            echo "crds.install=false still rendered the CRD"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache envtest assets
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/setup-envtest
          key: ${{ runner.os }}-envtest-v1-${{ hashFiles('Makefile', 'go.mod') }}
          restore-keys: |
            ${{ runner.os }}-envtest-v1-

      - name: Bootstrap tools
        run: make bootstrap

      - name: Install envtest assets
        run: |
          make envtest-setup
          echo "KUBEBUILDER_ASSETS=$(./bin/setup-envtest use -p path)" >> "$GITHUB_ENV"

      # Requires: test: go test -race -count=1 ./... in the Makefile.
      # The concurrency tests (heartbeat, pumps, MVCC, watchdog) are
      # theater without the race detector.
      # -count=1 disables test caching (cached runs hide flaky service
      # interactions); -covermode=atomic is the only mode sound under -race.
      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

      - name: Build (host)
        run: make build

  # Cross-compile: enforces the PR-3 acceptance ("GOOS=darwin/windows
  # go build pass") forever. Build tags in internal/plugin/proc only
  # compile for the running OS — Linux-only CI lets them rot silently.
  # Compile-only, pure Go, from linux runners — no macOS/Windows runners
  # needed. CGO_ENABLED=0 is also the phase-2 constraint: tarball
  # binaries must be static per platform, so cgo debt fails HERE, today,
  # not in the release job later.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
