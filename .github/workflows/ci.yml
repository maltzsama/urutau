name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Bootstrap tools
        run: make bootstrap

      - name: Regenerate proto (check freshness)
        run: |
          make proto
          git diff --exit-code -- internal/transport/pb

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build
