syntax = "proto3";

package urutau.v1;

option go_package = "github.com/maltzsama/urutau/internal/transport/pb/urutau/v1;pb";

// Control plane: handshake, acks, and chunks. Carries NO data.
service UrutauControl {
  rpc Session(stream WorkerMessage) returns (stream CoordinatorMessage);

  // Urgent signals on the SAME ClientConn — never queued behind data.
  rpc Control(stream WorkerMessage) returns (stream ControlMessage);
}

message WorkerMessage {
  oneof msg {
    Hello hello = 1;
    Ack ack = 2;
    ChunkReady chunk = 3;
    WorkerError error = 4;
  }
}

message CoordinatorMessage {
  oneof msg {
    Assignment assign = 1;
    ChunkRequest chunk = 2;
  }
}

message ControlMessage {
  oneof msg {
    Pause pause = 1;
    Shutdown shutdown = 2;
  }
}

message Hello {
  string worker_name = 1;
  string pod_uid = 2;                 // detects zombies
  uint64 epoch = 3;                   // bumped on every reset
  map<string, string> committed = 4;  // target_table → position
  string image_digest = 5;            // detects image skew
}

message Ack {
  uint64 batch_id = 1;
  string table = 2;
  string position = 3;  // position AFTER the Iceberg commit
  uint64 rows = 4;
  int64 commit_ms = 5;
}

message Assignment {
  string worker_name = 1;
  uint64 epoch = 2;
  repeated string tables = 3;  // target tables of this worker
  bytes ticket = 4;            // Flight DoGet ticket
}

message ChunkRequest {
  string table = 1;
  uint32 chunk_id = 2;
  bytes low = 3;   // lower PK bound (lexicographic tuple)
  bytes high = 4;  // upper PK bound
}

message ChunkReady {
  uint32 chunk_id = 1;
  uint64 rows = 2;
}

message WorkerError {
  string code = 1;
  string detail = 2;
}

message Pause {
  string reason = 1;
}

message Shutdown {
  int64 deadline_ms = 1;
}

// Data plane: the FlightData body is raw Arrow IPC; BatchMeta travels in
// FlightData.app_metadata.
message BatchMeta {
  string table = 1;
  string low_pos = 2;
  string high_pos = 3;
  uint64 batch_id = 4;
  WindowTag window = 5;
}

message WindowTag {
  bool in_window = 1;
  bool closes = 2;
  uint32 chunk_id = 3;
}
