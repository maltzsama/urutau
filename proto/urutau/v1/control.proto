syntax = "proto3";

package urutau.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/maltzsama/urutau/internal/transport/pb/urutau/v1;pb";

// Control plane: handshake, acks, and chunks. Carries NO data.
service UrutauControl {
  rpc Session(stream WorkerMessage) returns (stream CoordinatorMessage);
  // Urgent signals on the SAME ClientConn — never queued behind data.
  rpc Control(stream WorkerMessage) returns (stream ControlMessage);
}

message WorkerMessage {
  oneof msg {
    Hello       hello        = 1;
    Ack         ack          = 2;
    ChunkReady  chunk_ready  = 3;
    ChunkFailed chunk_failed = 4;
    WorkerError error        = 5;
    StagedBatch staged       = 6;  // staged data files, one per delivery (WK-001 C5)
    MaintenanceResult maintenance_result = 7;  // one ephemeral maintenance pass's outcome
    WorkerMetricsReport worker_metrics = 8;    // periodic worker-side series the coordinator cannot derive from acks
    SchemaDrift         schema_drift   = 9;    // the worker detected schema drift and is stopping (issue #272)
  }
}

// SchemaDrift reports a column the source carries that the declared schema
// lacks; the worker fails after sending it, so the coordinator can surface the
// reason instead of a bare CrashLoopBackOff.
message SchemaDrift {
  string table  = 1;
  string column = 2;
  string kind   = 3; // "added"
}

message CoordinatorMessage {
  oneof msg {
    Assignment            assign      = 1;
    ChunkRequest          chunk       = 2;
    MaintenanceAssignment maintenance = 3;
  }
}

message ControlMessage {
  oneof msg {
    Pause    pause    = 1;
    Shutdown shutdown = 2;
  }
}

// ── Handshake ────────────────────────────────────────────────────────────
enum WorkerPhase {
  WORKER_PHASE_UNSPECIFIED  = 0;
  WORKER_PHASE_STARTING     = 1;
  WORKER_PHASE_SNAPSHOTTING = 2;  // → coordinator re-issues pending chunks
  WORKER_PHASE_STREAMING    = 3;  // → coordinator opens an interval reader
}

message Hello {
  string      worker_name  = 1;
  string      pod_uid      = 2;   // detects zombies
  uint64      epoch        = 3;   // bumped on every reset
  WorkerPhase phase        = 4;   // decides the recovery path
  string      image_digest = 5;   // detects image skew

  // target_table → committed position, read from the Iceberg table property.
  map<string, string> committed = 6;
  // Chunk ids already completed, per source table. Lets the coordinator
  // re-issue only what is pending after a mid-snapshot restart.
  map<string, ChunkIds> completed_chunks = 7;

  // maintenance marks an ephemeral maintenance worker: it runs ONE
  // maintenance pass for one table and exits. The coordinator answers with a
  // MaintenanceAssignment (never a data Assignment), and does not supervise
  // it for acks — it has no data plane.
  bool maintenance = 8;
}

// MaintenanceAssignment is the maintenance worker's whole job: the table to
// maintain, the operations to run (in order), and the operation parameters.
// Intervals are NOT here: the coordinator already decided which operations
// are due.
message MaintenanceAssignment {
  string          target_table       = 1;  // "raw.orders"
  repeated string ops                = 2;  // "compaction", "snapshot_expiry", "orphan_cleanup"
  bytes           maintenance_config = 3;  // JSON spec.Maintenance (parameters; intervals ignored)
}

// MaintenanceResult is what an ephemeral maintenance worker reports after a
// pass: one entry per operation that actually ran, in execution order, with
// raw counts and the error (empty on success). The coordinator records them
// in its own long-lived registry — the worker's own /metrics dies with the
// worker, so this is what makes the counts survive to a scrape.
message MaintenanceResult {
  repeated MaintenanceOpResult ops = 1;
}

message MaintenanceOpResult {
  oneof op {
    CompactionResult compaction = 1;
    ExpiryResult     expiry     = 2;
    OrphanResult     orphan     = 3;
  }
}

message CompactionResult {
  int64  files_removed = 1;
  int64  files_added   = 2;
  int64  bytes_before  = 3;
  int64  bytes_after   = 4;
  string error         = 5;  // empty on success
}

message ExpiryResult {
  int64  snapshots_removed = 1;
  string error             = 2;  // empty on success
}

message OrphanResult {
  int64  files_deleted = 1;
  int64  bytes_freed   = 2;
  string error         = 3;  // empty on success
}

// WorkerMetricsReport is the worker's periodic report of the series the
// coordinator cannot derive from acks: commit failures, dropped deletes,
// snapshot progress, and enrich counters. Per-table (and per-reference for
// enrich), so the coordinator can label its own registry. Counters are
// cumulative totals, not deltas.
message WorkerMetricsReport {
  repeated TableMetrics tables = 1;
}

message TableMetrics {
  string         table             = 1;
  int64          commit_failures   = 2;
  int64          deletes_dropped   = 3;
  double         snapshot_progress = 4;
  repeated EnrichMetrics enrich    = 5;
  double         commit_latency_ms = 6;  // last Iceberg commit latency, per table
}

message EnrichMetrics {
  string reference     = 1;
  int64  misses        = 2;
  int64  inner_dropped = 3;
  int64  evicted       = 4;
}

message ChunkIds {
  repeated uint32 ids = 1;
}

// ── Assignment ───────────────────────────────────────────────────────────
enum WriteMode {
  WRITE_MODE_UNSPECIFIED = 0;
  WRITE_MODE_UPSERT      = 1;
  WRITE_MODE_APPEND      = 2;
}

// EnrichRef is one broadcast reference join the worker applies to the
// table's events: the reference is read whole into the worker's RAM and
// re-read on the refresh interval. The coordinator owns the spec; the
// worker owns the join.
message EnrichRef {
  string              table        = 1;  // reference name (diagnostics)
  string              source_uri   = 2;  // reference connection (mysql:// | postgres://)
  string              source_query = 3;  // full reference image SELECT
  map<string, string> on           = 4;  // event column → reference column
  repeated string     select       = 5;  // required: reference columns to inject ("*" = all except join key)
  map<string, string> as           = 6;  // reference column → destination name
  string              join_type    = 7;  // left | inner
  string              refresh      = 8;  // duration; empty = worker default (5m)
  string              on_cold_start = 9; // buffer | pass | drop (empty = buffer)
  int64               buffer_max_events = 10;
  string              buffer_max_wait   = 11; // duration; empty = unbounded
}

message TableAssignment {
  string    source_table         = 1;  // "shop.orders"
  string    target_table         = 2;  // "lakehouse.orders"
  WriteMode write_mode           = 3;
  repeated string primary_key    = 4;  // equality-delete key; required on upsert
  repeated string partition_by   = 5;  // native Iceberg transforms
  bool      include_before       = 6;  // derived: true only with a mutable-column filter
  bool      create_if_not_exists = 7;
  bytes     schema_arrow         = 8;  // table schema as Arrow IPC (data columns); the coordinator owns introspection
  repeated EnrichRef enrich      = 9;  // broadcast reference joins, applied in order
  bytes     cast_policy          = 10; // JSON core.CastPolicy — writes must apply the same overrides as the coordinator's DDL
  bytes     metadata             = 11; // JSON []core.MetadataColumn — pipeline metadata columns land in the target
  bool      staged               = 12; // workers>1 on a staging sink: stage data files, let the coordinator commit the cycle (WK-001 C5.5)
  repeated string column_filter   = 13; // source column projection (#162): the snapshot SELECT list
  bytes     filter                = 14; // JSON spec.Filter (#163): the source WHERE predicate, composed with the chunk bounds
  string    chunk_column          = 15; // snapshot chunking column (#151); empty = the source's default (Postgres CTID)
  string    on_delete             = 16; // spec.OnDelete ("skip" | "record" | ""); append-only delete handling (issue #264)
}

message BatchConfig {
  int64                    max_bytes    = 1;
  google.protobuf.Duration max_interval = 2;
}

message Assignment {
  string      worker_name = 1;
  uint64      epoch       = 2;
  string      run_id      = 3;
  bytes       ticket      = 4;  // Flight DoGet ticket
  repeated TableAssignment tables = 5;
  BatchConfig batching    = 6;  // already resolved, including worker override
  string      resume_from = 7;  // min() position this worker resumes from
  string      source_kind = 8;  // "mysql" | "postgres" — how to parse positions
  string      source_dsn  = 9;  // query connection for snapshot chunk SELECTs
  uint32      chunk_size  = 10; // DBLog chunk granularity for chunk SELECTs
  // postgres is the JSON spec.PostgresSource the worker rebuilds its snapshot
  // query source from, needed when the DSN alone cannot express the config —
  // an SSH tunnel has a DialFunc, not a DSN. Empty means "use source_dsn"
  // (a URI source, or a scoped read-only snapshotUri).
  bytes       postgres    = 11;
}

// ── Acks ─────────────────────────────────────────────────────────────────
message Ack {
  uint64 batch_id = 1;
  uint64 epoch    = 2;  // stale-epoch acks are rejected
  string table    = 3;  // target table
  string position = 4;  // position AFTER the Iceberg commit
  uint64 rows     = 5;
  uint64 deletes  = 6;  // equality deletes written — feeds collapse_ratio
  google.protobuf.Duration commit_duration = 7;
}

// ── DBLog chunks ─────────────────────────────────────────────────────────
message ChunkRequest {
  string table          = 1;  // source table
  uint32 chunk_id       = 2;
  bytes  bounds         = 3;  // Arrow IPC record: row 0 = low, row 1 = high (absent = open high)
  bool   inclusive_high = 4;  // true only on the last chunk
}

message ChunkReady {
  string table             = 1;  // disambiguates parallel chunks
  uint32 chunk_id          = 2;
  uint64 rows              = 3;
  uint64 dropped_by_window = 4;  // proves DBLog is working
  uint64 epoch             = 5;  // the Assignment epoch this reply belongs to; stale-epoch replies are ignored
}

message ChunkFailed {
  string     table    = 1;
  uint32     chunk_id = 2;
  ErrorClass class    = 3;
  string     detail   = 4;
}

// ── Staged commits (WK-001 C5) ───────────────────────────────────────────
// A worker of a partitioned table writes its parquet data files and sends
// the opaque descriptor here instead of committing; the coordinator
// aggregates every delivery of one binlog batch (a cycle) and commits it
// once via StagedCommitter. Carries no data — only the descriptor and the
// batch metadata needed to close the cycle.
message StagedBatch {
  string          table            = 1;  // target table
  uint64          seq              = 2;  // BatchMeta.batch_id — the cycle key
  bytes           descriptor       = 3;  // opaque payload from WriteStaged (DataFile codec)
  string          position         = 4;  // the batch's high position (watermark)
  string          snapshot_state   = 5;  // resumable-backfill state ("" when not in snapshot)
  repeated uint32 snapshot_pending = 6;  // chunk ids still to process
  uint64          epoch            = 7;  // stale-epoch guards, like Ack
}

// ── Errors ───────────────────────────────────────────────────────────────
enum ErrorClass {
  ERROR_CLASS_UNSPECIFIED  = 0;
  ERROR_CLASS_TRANSIENT    = 1;  // retry with backoff
  ERROR_CLASS_WORKER_FATAL = 2;  // kill the worker → reset
  ERROR_CLASS_JOB_FATAL    = 3;  // terminal
  ERROR_CLASS_NEEDS_HUMAN  = 4;  // pause, wait for intervention
}

message WorkerError {
  ErrorClass class  = 1;
  string     code   = 2;  // stable machine-readable id, e.g. "commit_exhausted"
  string     detail = 3;
  string     table  = 4;  // optional
}

// ── Control signals ──────────────────────────────────────────────────────
message Pause {
  string reason = 1;
  string table  = 2;  // schema mismatch pauses ONE table, not the whole worker
}

message Shutdown {
  google.protobuf.Duration grace = 1;
  // true  → flush + commit + ack in-flight, exit 0 (graceful)
  // false → abort in-flight transactions, exit 1
  bool drain = 2;
}

// ── Data plane ───────────────────────────────────────────────────────────
// The FlightData body is raw Arrow IPC; BatchMeta travels in
// FlightData.app_metadata.
message BatchMeta {
  string    table    = 1;  // target table
  string    low_pos  = 2;
  string    high_pos = 3;
  uint64    batch_id = 4;
  uint64    epoch    = 5;  // same guard as Ack
  WindowTag window   = 6;
  // staged tells the worker to stage this batch (write files, ship the
  // descriptor, let the coordinator commit the cycle) instead of committing
  // it directly. The coordinator decides per batch, so a table that changes
  // commit mode on a re-slice (1 owner → N) is consistent from the first
  // batch after the flip: the surviving owner stages too, and its cycle is
  // not left open blocking the new owners' cycles.
  bool staged = 7;
}

message WindowTag {
  bool   in_window = 1;
  bool   closes    = 2;
  uint32 chunk_id  = 3;
  bool   snapshot  = 4;  // true → rows feed AddWindowRows, not the ingest path
}