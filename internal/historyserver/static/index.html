<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urutau history</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; }
  header { padding: 12px 16px; border-bottom: 1px solid #8884; }
  h1 { font-size: 16px; margin: 0; }
  main { display: grid; grid-template-columns: 220px 260px 1fr; min-height: calc(100vh - 50px); }
  section { border-right: 1px solid #8884; padding: 12px; overflow: auto; }
  section:last-child { border-right: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin: 0 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 4px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li:hover { background: #8883; }
  li[aria-selected="true"] { background: #3b82f633; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #8883; vertical-align: top; }
  td.fields { white-space: pre-wrap; word-break: break-word; }
  .muted { opacity: .6; }
  .warn { color: #b91c1c; background: #ef444422; border: 1px solid #ef444466; border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; }
  button { font: inherit; margin-top: 8px; padding: 4px 10px; cursor: pointer; }
  .filter { font-size: 12px; margin-bottom: 8px; opacity: .8; }
  .filter select { font: inherit; }
  td.level { white-space: nowrap; font-weight: 600; }
  td.level.ERROR { color: #b91c1c; }
  td.level.WARN { color: #b45309; }
</style>
</head>
<body>
<header><h1>Urutau history <span class="muted">— terminated runs</span></h1></header>
<main>
  <section>
    <h2>Pipelines</h2>
    <ul id="pipelines"></ul>
  </section>
  <section>
    <h2>Runs</h2>
    <ul id="runs"></ul>
  </section>
  <section>
    <h2 id="events-title">Events</h2>
    <div class="filter">Show
      <select id="kind">
        <option value="all">events + logs</option>
        <option value="event">events only</option>
        <option value="log">logs only</option>
      </select>
    </div>
    <div id="events"></div>
  </section>
</main>
<script>
const API = '/api/v1';
const $ = (id) => document.getElementById(id);
// The writer's slog levels: whitelisted so a level from the trail can only
// ever pick a class that exists in the stylesheet.
const LEVELS = ['DEBUG', 'INFO', 'WARN', 'ERROR'];
// The run on screen; the Show select reloads it under the new filter.
let current = null;

async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
  return r.json();
}

function renderList(el, items, label, onPick) {
  el.replaceChildren();
  if (!items.length) {
    const li = document.createElement('li');
    li.className = 'muted';
    li.textContent = 'none';
    el.append(li);
    return;
  }
  for (const item of items) {
    const li = document.createElement('li');
    li.textContent = label(item);
    li.onclick = () => {
      for (const s of el.children) s.removeAttribute('aria-selected');
      li.setAttribute('aria-selected', 'true');
      onPick(item);
    };
    el.append(li);
  }
}

async function pickPipeline(name) {
  current = null;
  $('runs').replaceChildren();
  $('events').replaceChildren();
  $('events-title').textContent = 'Events';
  const {runs = []} = await api(`/pipelines/${encodeURIComponent(name)}/runs`);
  renderList($('runs'), runs,
    (r) => {
      // The outcome (issue #350) is independent of trail completeness; show it
      // as a prefix so the list reads without opening each run.
      const badge = r.outcome && r.outcome !== 'unknown' ? `[${r.outcome}] ` : '';
      return r.started ? `${badge}${r.id}  ${r.started}` : `${badge}${r.id}`;
    },
    (run) => pickRun(name, run.id));
}

async function pickRun(pipeline, runID) {
  current = {pipeline, run: runID};
  $('events-title').textContent = `Events — ${runID}`;
  $('events').replaceChildren();
  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>time</th><th>kind</th><th>fields</th></tr></thead><tbody></tbody>';
  const tbody = table.tBodies[0];
  $('events').append(table);

  let cursor = '';
  let headed = false;
  const more = document.createElement('button');
  more.textContent = 'Load more';
  more.hidden = true;

  // The Show filter rides on every page: changing it restarts pagination, so
  // the cursor never straddles two different filters.
  function pageQuery() {
    const parts = [];
    const kind = $('kind').value;
    if (kind && kind !== 'all') parts.push('kind=' + encodeURIComponent(kind));
    if (cursor) parts.push('cursor=' + encodeURIComponent(cursor));
    return parts.length ? '?' + parts.join('&') : '';
  }

  // A truncated or abandoned run must not render as a clean one: the server
  // sends the completeness signals with every page (issues #329, #333).
  function trailWarning(sealed, emitted, dropped, missing) {
    const bits = [];
    if (!sealed) bits.push('the run did not finish cleanly, so the trail may be missing its tail');
    if (missing > 0) bits.push(`${missing} event(s) the writer accepted are missing`);
    if (dropped) bits.push('the writer dropped buffered events under an S3 backlog');
    if (!bits.length) return null;
    const div = document.createElement('div');
    div.className = 'warn';
    div.textContent = 'Incomplete trail: ' + bits.join('; ') + '.';
    return div;
  }

  async function page() {
    const {events = [], nextCursor = '', sealed = true, emitted = 0, dropped = false, missing = 0, outcome = 'unknown'} =
      await api(`/pipelines/${encodeURIComponent(pipeline)}/runs/${encodeURIComponent(runID)}/events${pageQuery()}`);
    if (!headed) {
      headed = true;
      // The outcome is independent of the completeness signals (issue #350).
      $('events-title').textContent = `Events — ${runID}  ·  outcome: ${outcome}`;
      const warning = trailWarning(sealed, emitted, dropped, missing);
      if (warning) $('events').prepend(warning);
    }
    // Every cell is set with textContent: a trail's kind/timestamp is
    // free-form and must never be interpreted as markup (issue #334).
    for (const e of events) {
      const tr = document.createElement('tr');
      const tdTime = document.createElement('td');
      tdTime.className = 'muted';
      tdTime.textContent = e.timestamp ?? '';
      const tdKind = document.createElement('td');
      const tdFields = document.createElement('td');
      tdFields.className = 'fields';
      if (e.kind === 'log') {
        // A log record reads as a log line, not as JSON: the level takes the
        // kind column, the message plus its context the fields column.
        const f = e.fields ?? {};
        const lvl = typeof f.level === 'string' ? f.level : '';
        tdKind.className = 'level' + (LEVELS.includes(lvl) ? ' ' + lvl : '');
        tdKind.textContent = lvl || 'log';
        tdFields.textContent = String(f.msg ?? '') +
          (f.attrs ? '  ' + JSON.stringify(f.attrs) : '');
      } else {
        tdKind.textContent = e.kind ?? '';
        tdFields.textContent = JSON.stringify(e.fields ?? {});
      }
      tr.append(tdTime, tdKind, tdFields);
      tbody.append(tr);
    }
    cursor = nextCursor;
    more.hidden = !cursor;
  }

  more.onclick = page;
  $('events').append(more);
  await page();
}

(async function init() {
  // Re-render the open run under the new Show filter, cursor from scratch.
  $('kind').onchange = () => { if (current) pickRun(current.pipeline, current.run); };
  try {
    const {pipelines = []} = await api('/pipelines');
    renderList($('pipelines'), pipelines, (p) => p.name, (p) => pickPipeline(p.name));
  } catch (err) {
    const li = document.createElement('li');
    li.className = 'muted';
    li.textContent = `failed: ${err.message}`;
    $('pipelines').replaceChildren(li);
  }
})();
</script>
</body>
</html>
