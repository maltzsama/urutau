# Default values for urutau-operator.
#
# This chart is an ALTERNATIVE to the kustomize install (config/ +
# `make k8s-deploy`), not a replacement: it ships the same resources with the
# namespace, image, replicas and resources driven by values instead of
# kustomize edits.

# Override the resource name base. The default ("urutau-operator") keeps an
# existing install's names; set fullnameOverride to run a second release in
# the same cluster without colliding on the cluster-scoped resources
# (ClusterRole, ClusterRoleBinding, ValidatingWebhookConfiguration). It does
# NOT rename the CRD — its name is the API identity — so a second release must
# also set crds.install=false (issue #360).
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/maltzsama/urutau
  # tag defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Pull secrets for the operator image (e.g. a private-registry mirror).
imagePullSecrets: []

operator:
  # Leader election makes more than one replica safe: only the leader
  # reconciles, the rest are hot standbys.
  replicaCount: 2
  # Server-Side Apply field manager name.
  fieldManager: urutau-operator
  # Comma-separated namespaces to watch (empty = all). Scoping the operator to
  # specific namespaces needs a RoleBinding in each; see the repo's
  # config/multi-tenant for the model. This scopes the CACHE only — pair it
  # with rbac.clusterWide=false for the permissions boundary.
  watchNamespaces: ""
  # Worker autoscaling (issue #298). A non-empty prometheusAddress turns the
  # feature on: the operator renders one KEDA ScaledObject per table that sets
  # spec.workers.max, driven by the coordinator's per-table backlog metric.
  # Requires KEDA and a Prometheus scraping the coordinator's /metrics.
  # Empty (the default) disables it — no ScaledObject is rendered.
  keda:
    prometheusAddress: ""
    # Per-replica backlog target (outstanding batches). The operator default
    # is 30 when empty.
    threshold: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Whether this release owns the CDCPipeline CRD. The CRD's name is the API
# identity (cdcpipelines.urutau.io) and cannot be renamed, so a second release
# in the same cluster must set install=false and share the first release's CRD
# (issue #360). fullnameOverride renames every OTHER cluster-scoped resource.
crds:
  install: true

# RBAC scope. clusterWide (default) binds the operator's ClusterRole across the
# cluster. Set clusterWide=false to bind it only into each
# operator.watchNamespaces namespace (the repo's config/multi-tenant model) —
# then watchNamespaces must be non-empty (issue #361).
rbac:
  clusterWide: true

# Extra annotations on the operator Pod.
podAnnotations: {}
# Standard pod placement knobs.
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

# A PodDisruptionBudget for the operator. replicaCount defaults to 2 so leader
# election gives HA; without a PDB a node drain can evict both replicas at
# once, which defeats that. Off by default so the default render is unchanged.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# A metrics Service + ServiceMonitor for a Prometheus Operator install. Off by
# default: the ServiceMonitor needs the monitoring.coreos.com CRDs.
serviceMonitor:
  enabled: false
  interval: 30s
  # Extra labels on the ServiceMonitor (e.g. for a Prometheus selector).
  labels: {}

webhook:
  # Disable to run without the admission webhook. The reconciler still
  # validates, so this loses the admission-time check, not correctness.
  enabled: true
  # cert-manager issues the webhook serving certificate. Disable it only if
  # you also supply webhook.caBundle AND pre-create the
  # `<fullname>-webhook-cert` Secret (keys tls.crt/tls.key): the render fails
  # when cert-manager is off and no caBundle is given, because the webhook
  # declares failurePolicy: Fail and would otherwise reject every CDCPipeline
  # write.
  certManager:
    enabled: true
  # The ValidatingWebhookConfiguration's caBundle, base64-encoded PEM. Used
  # only when certManager.enabled=false.
  caBundle: ""
