{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
# The webhook's serving certificate, issued by cert-manager with a
# self-signed issuer. dnsNames follow the release namespace, so an install
# into any namespace gets a cert whose SAN matches the Service the apiserver
# dials (the kustomize base hardcodes urutau-system here).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: urutau-operator-selfsigned
  labels:
    {{- include "urutau-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: urutau-operator-webhook-cert
  labels:
    {{- include "urutau-operator.labels" . | nindent 4 }}
spec:
  secretName: urutau-operator-webhook-cert
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  dnsNames:
    - urutau-operator-webhook.{{ .Release.Namespace }}.svc
    - urutau-operator-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: urutau-operator-selfsigned
    kind: Issuer
{{- end }}
