apiVersion: v1
kind: ServiceAccount
metadata:
  name: urutau-operator
  labels:
    {{- include "urutau-operator.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urutau-operator
  labels:
    {{- include "urutau-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  # Leader election makes more than one replica safe.
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: urutau-operator
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urutau-operator
        app.kubernetes.io/part-of: urutau
        control-plane: controller-manager
    spec:
      serviceAccountName: urutau-operator
      securityContext:
        runAsNonRoot: true
        # The distroless image's USER is the non-numeric `nonroot`, which
        # runAsNonRoot alone cannot verify — pin its UID/GID (65532).
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "urutau-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["urutau-operator"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Kept equal to this container's image; referenced from
            # --coordinator-image below via $(VAR) argument expansion.
            - name: COORDINATOR_IMAGE
              value: {{ include "urutau-operator.image" . }}
          args:
            - --coordinator-image=$(COORDINATOR_IMAGE)
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --enable-webhook={{ .Values.webhook.enabled }}
            - --field-manager={{ .Values.operator.fieldManager }}
            {{- if .Values.operator.watchNamespaces }}
            - --watch-namespaces={{ .Values.operator.watchNamespaces }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: webhook
              containerPort: 9443
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            # controller-runtime's default webhook cert directory.
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-cert
          secret:
            secretName: urutau-operator-webhook-cert
      {{- end }}
