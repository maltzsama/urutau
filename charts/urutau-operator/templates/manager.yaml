apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urutau-operator.fullname" . }}
  labels:
    {{- include "urutau-operator.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urutau-operator.fullname" . }}
  labels:
    {{- include "urutau-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  # Leader election makes more than one replica safe.
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "urutau-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "urutau-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: urutau
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "urutau-operator.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # The distroless image's USER is the non-numeric `nonroot`, which
        # runAsNonRoot alone cannot verify — pin its UID/GID (65532).
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "urutau-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["urutau-operator"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Kept equal to this container's image; referenced from
            # --coordinator-image below via $(VAR) argument expansion.
            - name: COORDINATOR_IMAGE
              value: {{ include "urutau-operator.image" . }}
          args:
            - --coordinator-image=$(COORDINATOR_IMAGE)
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --enable-webhook={{ .Values.webhook.enabled }}
            - --field-manager={{ .Values.operator.fieldManager }}
            {{- if .Values.operator.watchNamespaces }}
            - --watch-namespaces={{ .Values.operator.watchNamespaces }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: 9443
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            # controller-runtime's default webhook cert directory.
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-cert
          secret:
            secretName: {{ include "urutau-operator.fullname" . }}-webhook-cert
      {{- end }}
