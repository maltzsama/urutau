{{- if .Values.podDisruptionBudget.enabled }}
# Keep at least one operator replica available through a voluntary disruption
# (a node drain). replicaCount defaults to 2 so leader election gives HA;
# without this a drain can evict both replicas at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "urutau-operator.fullname" . }}
  labels:
    {{- include "urutau-operator.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "urutau-operator.selectorLabels" . | nindent 6 }}
{{- end }}
